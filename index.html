<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#1b5e20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Tarjeta de Contacto Digital - Tecnoprofedavid">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

<script>
    // Dentro de tu objeto myManifest, asegúrate de que los iconos coincidan:
    "icons": [
        {
            "src": "icon-192x192.png",
            "sizes": "192x192",
            "type": "image/png"
        },
        {
            "src": "icon-512x512.png",
            "sizes": "512x512",
            "type": "image/png"
        }
    ]
</script>

    <title>Contacto PWA</title>

   <style>
        :root {
            --primary-green: #2e7d32;
            --dark-green: #1b5e20;
            --pure-white: #ffffff;
            --bg-page: #f0f4f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* TARJETA VISUAL - DISEÑO 50/50 */
        #card-container {
            width: 100%;
            max-width: 340px;
            background: var(--pure-white);
            border: 4px solid var(--dark-green);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            text-align: center;
        }

        /* BOTÓN CONFIGURACIÓN */
        .btn-config {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.15);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        /* PARTE SUPERIOR (VERDE) */
        .card-top {
            height: 160px;
            background: var(--primary-green);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        #display-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid var(--pure-white);
            object-fit: cover;
            background: #e0e0e0;
            margin-bottom: -65px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* PARTE INFERIOR (BLANCA) */
        .card-bottom {
            padding: 80px 20px 25px 20px;
            background: var(--pure-white);
        }

        .info h1 { margin: 0; font-size: 1.6rem; color: var(--dark-green); }
        .info .role { margin: 5px 0; color: #555; font-size: 1rem; }
        .info .company { 
            font-weight: bold; 
            color: var(--primary-green); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 20px; 
            letter-spacing: 1px;
        }

        .contact-details {
            font-size: 0.9rem;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* BOTÓN COMPARTIR */
        .btn-share {
            background: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .btn-share:active { transform: scale(0.98); }

        /* MODAL DE CONFIGURACIÓN */
        #modal-editor {
            display: none;
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            padding: 25px;
            overflow-y: auto;
        }

        .field { margin-bottom: 15px; text-align: left; }
        .field label { display: block; font-weight: bold; font-size: 0.75rem; margin-bottom: 5px; color: #666; }
        .field input, .field select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box;
            font-size: 1rem;
        }

        .footer-note { margin-top: 20px; font-size: 0.7rem; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <div id="card-container">
        <button class="btn-config" onclick="openEditor()">⚙️</button>
        
        <div class="card-top">
            <!-- La imagen se carga desde localStorage -->
            <img id="display-photo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ccc'/%3E%3C/svg%3E">
        </div>

        <div class="card-bottom">
            <div class="info">
                <h1 id="view-name">Tu Nombre</h1>
                <p class="role" id="view-role">Tu Profesión</p>
                <span class="company" id="view-comp">Nombre Empresa</span>
            </div>

            <div class="contact-details">
                <div id="view-email">✉️ correo@ejemplo.com</div>
                <div id="view-r1">Red 1: ...</div>
                <div id="view-r2">Red 2: ...</div>
            </div>

            <button class="btn-share" onclick="shareContact()">
                🚀 COMPARTIR DATOS
            </button>
        </div>
    </div>

    <div class="footer-note">Idea de Tecnoprofedavid programada por Gemini</div>

    <!-- EDITOR -->
    <div id="modal-editor">
        <h2 style="color: var(--dark-green);">Configurar Tarjeta</h2>
        
        <div class="field">
            <label>Foto de Perfil (Se guardará automáticamente)</label>
            <input type="file" accept="image/*" id="input-photo" onchange="handleImage(this)">
        </div>

        <div class="field"><label>Nombre Completo</label><input type="text" id="input-name"></div>
        <div class="field"><label>Cargo / Profesión</label><input type="text" id="input-role"></div>
        <div class="field"><label>Empresa</label><input type="text" id="input-comp"></div>
        <div class="field"><label>Correo Electrónico</label><input type="email" id="input-email"></div>

        <div class="field">
            <label>Red Social 1</label>
            <select id="input-r1-type">
                <option value="LinkedIn">LinkedIn</option>
                <option value="Instagram">Instagram</option>
                <option value="Web">Web</option>
            </select>
            <input type="text" id="input-r1-val" placeholder="URL o Usuario" style="margin-top:5px;">
        </div>

        <div class="field">
            <label>Red Social 2</label>
            <select id="input-r2-type">
                <option value="WhatsApp">WhatsApp</option>
                <option value="TikTok">TikTok</option>
                <option value="X">X (Twitter)</option>
            </select>
            <input type="text" id="input-r2-val" placeholder="Número o Usuario" style="margin-top:5px;">
        </div>

        <button class="btn-share" style="width:100%; margin-top:10px;" onclick="saveData()">GUARDAR Y CERRAR</button>
    </div>

    <script>
        // ABRIR/CERRAR EDITOR
        function openEditor() { document.getElementById('modal-editor').style.display = 'block'; }
        function closeEditor() { document.getElementById('modal-editor').style.display = 'none'; }

        // PROCESAR Y GUARDAR IMAGEN (BASE64)
        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    document.getElementById('display-photo').src = base64Image;
                    localStorage.setItem('pwa_user_photo', base64Image);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // GUARDAR DATOS DE TEXTO
        function saveData() {
            const userData = {
                name: document.getElementById('input-name').value,
                role: document.getElementById('input-role').value,
                comp: document.getElementById('input-comp').value,
                email: document.getElementById('input-email').value,
                r1t: document.getElementById('input-r1-type').value,
                r1v: document.getElementById('input-r1-val').value,
                r2t: document.getElementById('input-r2-type').value,
                r2v: document.getElementById('input-r2-val').value
            };
            localStorage.setItem('pwa_user_data', JSON.stringify(userData));
            updateUI(userData);
            closeEditor();
        }

        // ACTUALIZAR INTERFAZ
        function updateUI(data) {
            if(!data) return;
            document.getElementById('view-name').innerText = data.name || "Nombre";
            document.getElementById('view-role').innerText = data.role || "Profesión";
            document.getElementById('view-comp').innerText = data.comp || "Empresa";
            document.getElementById('view-email').innerText = "✉️ " + (data.email || "correo@ejemplo.com");
            document.getElementById('view-r1').innerText = data.r1t + ": " + (data.r1v || "...");
            document.getElementById('view-r2').innerText = data.r2t + ": " + (data.r2v || "...");

            // Sincronizar inputs
            document.getElementById('input-name').value = data.name || "";
            document.getElementById('input-role').value = data.role || "";
            document.getElementById('input-comp').value = data.comp || "";
            document.getElementById('input-email').value = data.email || "";
            document.getElementById('input-r1-val').value = data.r1v || "";
            document.getElementById('input-r2-val').value = data.r2v || "";
        }

        // COMPARTIR COMO TEXTO CON LINKS
        async function shareContact() {
            const data = JSON.parse(localStorage.getItem('pwa_user_data'));
            if(!data) return alert("Por favor, configura tus datos primero.");

            const shareText = `📇 Tarjeta de Contacto: ${data.name}\n📌 ${data.role} en ${data.comp}\n\n📧 Email: mailto:${data.email}\n🔗 ${data.r1t}: ${data.r1v}\n🔗 ${data.r2t}: ${data.r2v}\n\nEnviado desde mi Tarjeta PWA`;

            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Mi Contacto', text: shareText });
                } catch (err) { console.log("Error al compartir", err); }
            } else {
                navigator.clipboard.writeText(shareText);
                alert("Copiado al portapapeles (Tu dispositivo no soporta compartir directamente).");
            }
        }

        // CARGA INICIAL
        window.onload = () => {
            const savedData = JSON.parse(localStorage.getItem('pwa_user_data'));
            const savedPhoto = localStorage.getItem('pwa_user_photo');
            
            if(savedData) updateUI(savedData);
            if(savedPhoto) document.getElementById('display-photo').src = savedPhoto;

            // Registro de Service Worker para PWA (Offline)
            if ('serviceWorker' in navigator) {
                const sw = `self.addEventListener('install', e => e.waitUntil(caches.open('v1').then(c => c.addAll(['./']))));
                            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
                const blob = new Blob([sw], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            }
        };
    </script>
</body>
</html>
